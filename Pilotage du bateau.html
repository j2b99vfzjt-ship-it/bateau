<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pilotage du bateau</title>
<style>
:root{--bg:#f2f5f7;--surf:#fff;--ink:#0f2a3d;--mute:#5b7385;--sea:#1d6f8c;--sig:#c98a00;--stop:#b3261e;--line:#cfdae2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1c28;--surf:#12303f;--ink:#e8f1f6;--mute:#8fa9b9;--sea:#4fb3d1;--sig:#f0b840;--stop:#ff6b60;--line:#25475a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,"Segoe UI",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:16px;display:grid;gap:16px}
h1{font-size:1.25rem;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:var(--sea);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
#etat{color:var(--mute);font-size:.9rem}
.carte{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px}
.carte label{display:flex;justify-content:space-between;font-weight:600;margin-bottom:10px}
.val{font-variant-numeric:tabular-nums;color:var(--sig)}
input[type=range]{width:100%;height:44px;accent-color:var(--sea)}
.repere{display:flex;justify-content:space-between;color:var(--mute);font-size:.8rem}
#stop{background:var(--stop);font-size:1.3rem;padding:20px}
#msg{color:var(--stop);min-height:1.4em;font-size:.9rem}
.carte .opt{justify-content:flex-start;align-items:center;gap:12px;font-weight:400;margin:0;min-height:44px}
.opt input{width:24px;height:24px;accent-color:var(--sea)}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Pilotage du bateau</h1><button id="conn">Se connecter</button></div>
  <div id="etat">Non connecté</div>
  <div class="carte">
    <label for="barre"><span>Barre</span><span class="val" id="vb">90°</span></label>
    <input id="barre" type="range" min="45" max="135" value="90" step="1">
    <div class="repere"><span>Bâbord</span><span>Droit</span><span>Tribord</span></div>
  </div>
  <div class="carte">
    <label for="gaz"><span>Gaz</span><span class="val" id="vg">0 %</span></label>
    <input id="gaz" type="range" min="0" max="100" value="0" step="1">
    <div class="repere"><span>Arrêt</span><span>Plein régime</span></div>
  </div>
  <button id="stop">STOP</button>
  <div class="carte">
    <label class="opt"><input type="checkbox" id="autoBarre" checked> Barre : retour au centre quand je lâche</label>
    <label class="opt"><input type="checkbox" id="autoGaz"> Gaz : retour à zéro quand je lâche</label>
  </div>
  <div id="msg" role="status"></div>
</main>
<script>
const UART="6e400001-b5a3-f393-e0a9-e50e24dcca9e", RX="6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const $=id=>document.getElementById(id);
let car=null, timer=null, enc=new TextEncoder();
const barre=$("barre"), gaz=$("gaz");
// Les cases à cocher choisissent quels curseurs reviennent à leur position neutre au relâchement
const autoBarre=$("autoBarre"), autoGaz=$("autoGaz");

function maj(){ $("vb").textContent=barre.value+"°"; $("vg").textContent=gaz.value+" %"; }
async function envoyer(txt){
  if(!car) return;
  try{ await car.writeValueWithoutResponse(enc.encode(txt+"\n")); }
  catch(e){ $("msg").textContent="Envoi impossible : "+e.message; }
}
function battement(){ envoyer("B:"+barre.value); envoyer("G:"+gaz.value); }

barre.addEventListener("input",()=>{maj();battement();});
gaz.addEventListener("input",()=>{maj();battement();});
["pointerup","pointercancel"].forEach(ev=>{
  barre.addEventListener(ev,()=>{ if(autoBarre.checked){barre.value=90;maj();battement();} });
  gaz.addEventListener(ev,()=>{ if(autoGaz.checked){gaz.value=0;maj();battement();} });
});
$("stop").onclick=()=>{gaz.value=0;barre.value=90;maj();envoyer("S");};

$("conn").onclick=async()=>{
  if(!navigator.bluetooth){ $("msg").textContent="Web Bluetooth indisponible : ouvrez cette page dans Chrome sur Android."; return; }
  try{
    $("msg").textContent="";
    const dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:"BBC micro:bit"}],optionalServices:[UART]});
    dev.addEventListener("gattserverdisconnected",()=>{car=null;clearInterval(timer);$("etat").textContent="Déconnecté";$("conn").textContent="Se connecter";});
    $("etat").textContent="Connexion…";
    const srv=await dev.gatt.connect();
    const svc=await srv.getPrimaryService(UART);
    car=await svc.getCharacteristic(RX);
    $("etat").textContent="Connecté à "+dev.name;
    $("conn").textContent="Reconnecter";
    clearInterval(timer); timer=setInterval(battement,300);
  }catch(e){ $("msg").textContent="Connexion échouée : "+e.message; $("etat").textContent="Non connecté"; }
};
maj();
</script>
</body>
</html>
